# The support page (site/) opens this form with every field filled in from
# its own bug-report form, by field id. Rename an id here and the matching
# field on the page stops arriving: keep the two in step (see FIELDS in
# site/support.js). Text inputs rather than dropdowns, because GitHub only
# documents prefilling by id, not how a dropdown's value is written.
name: Bug report
description: Something in Sparkamp does not work the way it should.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, and what Sparkamp did.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: input
    id: version
    attributes:
      label: Sparkamp version
      description: Shown in Settings → About.
      placeholder: "1.4.1"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where did you get Sparkamp?
      placeholder: Mac App Store, downloaded disk image, Flatpak, or built from source
  - type: input
    id: interface
    attributes:
      label: Which interface?
      placeholder: macOS app, GTK on Linux, or the terminal (sparkamp --tui)
  - type: input
    id: system
    attributes:
      label: Operating system and version
      placeholder: macOS 26.1, or Fedora 43 with GNOME 49
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Error messages, the crash log, screenshots. Drag images straight into this box.
