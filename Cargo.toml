# Workspace root — main Sparkamp binary plus the macOS bridge crate. The
# Granite plasma visualizer is a built-in `VisualizerMode` living in
# `src/granite/`; both the GTK and macOS frontends render it directly.
[workspace]
members = [
    ".",                     # sparkamp main binary + library
    "frontends/macos",       # macOS static library bridge (Rust → Swift FFI)
]
resolver = "2"

[package]
name = "sparkamp"
version = "1.3.3"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "sparkamp"
path = "src/lib.rs"

[[bin]]
name = "sparkamp"
path = "src/main.rs"

[dependencies]
# Audio backend
gstreamer = "0.22"
gstreamer-sys = "0.22"
gstreamer-pbutils = "0.22"

# ID3 metadata
id3 = "1"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Config & playlist persistence
serde = { version = "1", features = ["derive"] }
# JSON marshaling for the device FFI (deep, variable-length device/sync DTOs
# cross the Swift boundary as JSON rather than brittle #[repr(C)] arrays).
serde_json = "1"
toml = "0.8"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# gnudb (CDDB) HTTP client — the endpoints are plain http://, so the
# default TLS-free feature set suffices; deliberately tiny to keep the
# Flatpak vendor tree lean (no reqwest/openssl pull-in).
minreq = "2"

# Duration probing (reads container headers without decoding audio)
# mp3/isomp4/aac are NOT in symphonia's default features — without them the
# format probe rejects MP3 and M4A files, leaving sample_rate/channels NULL
# for most of a typical library (found in the phase-1 user pass). WMA has no
# symphonia reader at all; those files keep NULL technical columns.
# `aiff` is here for macOS optical discs: an audio CD auto-mounts as one AIFF
# per track, and without a registered AIFF reader symphonia falls through to
# the MP3 demuxer, whose `sync_frame` scans to EOF hunting a sync word that a
# PCM file will never contain. On a ~40 MB track sitting on a spinning optical
# drive that is a full-file read every time anything probes it. Linux never
# noticed: there a CD track is a `cdda://` pseudo-URI that `File::open` simply
# rejects. See docs/superpowers/plans/2026-08-20-macos-disc-io-parity.md.
symphonia = { version = "0.5", features = ["mp3", "isomp4", "aac", "aiff"] }

# Parallel probing thread pool
rayon = "1"

# Utilities
dirs = "5"
anyhow = "1"
# Random number generation (shuffle)
rand = "0.8"

# Media library database (SQLite, bundled so no system dep needed)
rusqlite = { version = "0.31", features = ["bundled"] }

# Filesystem watching (F10 watch folders). notify is cross-platform (inotify on
# Linux, FSEvents on macOS); the debouncer coalesces bursty events so a bulk
# copy of many files does not trigger a per-file rescan storm.
notify = "6"
notify-debouncer-mini = "0.4"

# statvfs/access for free-space and writability checks, used by any unix build.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# GTK4 GUI — Linux only; not needed on macOS where SwiftUI replaces it.
[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
# udisks2 client for external-device detection + eject over the system D-Bus.
zbus = "5"
# libadwaita — used for exactly two widgets: AdwToastOverlay (transient
# error feedback) and AdwStatusPage (empty states). Adw's stylesheet loses
# to the skin CSS, which loads at STYLE_PROVIDER_PRIORITY_APPLICATION, so
# skinned surfaces are unaffected. Deliberately NOT used for preferences,
# about, or header bars — those would fight the skin system.
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }

# AVFoundation — macOS only. The App Store build cannot ship GStreamer:
# its plugins are dlopen'd through a shell-script launcher the store rejects,
# liborc JIT-compiles into RWX pages, and the bundle carries ~40 MB of dylibs
# needing signature and licence audit. See
# docs/superpowers/plans/2026-08-31-macos-audio-backend-spike.md.
#
# objc2 rather than a Swift shim: the spike confirmed installTapOnBus takes a
# typed AVAudioNodeTapBlock, so a Rust closure crosses with no hand-written
# trampoline, and the Swift-to-Rust dependency direction stays one-way.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSError"] }
block2 = "0.6"
# CoreFoundation types for the DiscRecording bindings in `src/disc/`. The
# framework's optical-drive API is C over CoreFoundation, so this is the whole
# binding surface — there is no `objc2-disc-recording` crate and none is
# needed. objc2-foundation already pulls this in; the features named here are
# the ones it does not (CFString, CFNumber).
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFArray",
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFString",
    "objc2",
] }
# AVFoundation has no equivalent of GStreamer's `spectrum` element, so the
# adapter runs its own FFT. Pure Rust rather than FFI into Accelerate: this is
# one 512-point transform per tap callback, roughly ten a second on a
# background thread, so vDSP's speed buys nothing measurable and would cost an
# unsafe boundary in the one place the two backends must agree numerically.
rustfft = "6"
objc2-avf-audio = { version = "0.3", features = [
    "block2",
    # AudioBufferList, which `manualRenderingBlock` renders into. That block is
    # the only offline-render path the bindings expose: 0.3.2 does not generate
    # `renderOffline:toBuffer:error:`, so the pan-law measurement test needs
    # this feature to exist at all.
    "objc2-core-audio-types",
    "AVAudioBuffer",
    "AVAudioEngine",
    "AVAudioFile",
    "AVAudioFormat",
    "AVAudioIONode",
    "AVAudioMixerNode",
    "AVAudioNode",
    "AVAudioPlayerNode",
    "AVAudioTime",
    "AVAudioTypes",
    "AVAudioUnit",
    "AVAudioUnitEQ",
    "AVAudioUnitEffect",
] }

[dev-dependencies]
# Temporary files for ID3 editor tests
tempfile = "3"
